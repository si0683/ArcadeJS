<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Моя игра</title>
    <link rel="icon" type="image/png" href="./assets/sprites/coin.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d1630;
        overflow: hidden;
      }
      /* Game portals require: no page scroll or pull-to-refresh, no text selection, no long-tap menu */
      html,
      body {
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Phones with a notch or rounded corners: keep the game inside the safe area */
      #game {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* "Turn your phone sideways" (src/orientation.ts): only on touch screens held upright */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        place-items: center;
        padding: 24px;
        background: #1d1630;
        color: #fff;
        font:
          700 22px/1.4 system-ui,
          sans-serif;
        text-align: center;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate.on {
          display: grid;
        }
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body oncontextmenu="return false">
    <div id="game"></div>
    <div id="rotate"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
